<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TaskTracker Cloud Pro</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 14px;
      --nav-height: 65px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: calc(var(--nav-height) + 20px); display: flex; flex-direction: column; }

    /* Sticky App Header */
    header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 90; padding: 14px 20px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    
    .sync-badge { font-size: 0.75rem; background: rgba(51, 65, 85, 0.5); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--card-border); display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
    .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

    /* Main Container & Views */
    main { padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; flex: 1; }
    .view { display: none; }
    .view.active { display: block; animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* UI Cards & Inputs */
    .card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--card-border); padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .card-title { font-size: 0.95rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-top: 12px; margin-bottom: 6px; text-transform: uppercase; }
    input, select, textarea { width: 100%; background: #0f172a; border: 1px solid var(--card-border); color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    
    .btn { width: 100%; background: var(--accent); color: #0f172a; font-weight: 700; border: none; padding: 14px; border-radius: 10px; font-size: 0.95rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: background 0.2s; margin-top: 14px; }
    .btn:active { opacity: 0.85; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--card-border); }
    .btn-danger { background: rgba(244, 63, 94, 0.15); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }

    /* Filter Chips */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
    .chip { background: #0f172a; border: 1px solid var(--card-border); color: var(--text-muted); font-size: 0.8rem; font-weight: 600; padding: 6px 14px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Task Item Styling */
    .task-item { background: #0f172a; border-radius: 10px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--card-border); position: relative; }
    .task-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
    .type-badge { font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; }
    .type-badge.achievement { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .type-badge.task { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .task-title { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .task-desc { font-size: 0.85rem; color: var(--text-muted); white-space: pre-wrap; line-height: 1.4; }
    .task-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
    .task-actions button { width: auto; padding: 6px 12px; font-size: 0.75rem; margin: 0; }

    /* Bottom Navigation Bar */
    nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height); background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600; gap: 4px; background: none; border: none; padding: 0; margin: 0; cursor: pointer; }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    .nav-item.active { color: var(--accent); }

    /* Auth Overlay */
    .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Authentication Overlay -->
  <div id="authScreen" class="auth-overlay">
    <div style="text-align: center; max-width: 320px;">
      <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 8px;">TaskTracker Pro</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 28px;">Secure task management synchronized directly to your private Google Drive storage.</p>
      <button id="googleSignInBtn" class="btn" style="background: #fff; color: #000; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand">
      <span class="brand-title">TaskTracker</span>
    </div>
    <div class="sync-badge" id="syncTrigger" style="cursor: pointer;">
      <span id="syncDot" class="dot"></span>
      <span id="syncText">Offline Mode</span>
    </div>
  </header>

  <!-- Main View Router -->
  <main id="appContent" class="hidden">

    <!-- VIEW 1: Entry Form (Add/Edit) -->
    <section id="viewEntry" class="view active">
      <div class="card">
        <div class="card-title">
          <span id="formHeaderTitle">New Entry</span>
          <button id="cancelEditBtn" class="btn btn-secondary hidden" style="width:auto; padding:4px 10px; font-size:0.75rem; margin:0;">Cancel</button>
        </div>

        <label>Clone Previous Record</label>
        <select id="historyDropdown">
          <option value="">-- Choose template from history --</option>
        </select>

        <label>Entry Type</label>
        <select id="taskType">
          <option value="Task">Task</option>
          <option value="Achievement">Achievement</option>
        </select>

        <label>Title</label>
        <input type="text" id="taskTitle" placeholder="e.g. Infrastructure Modernization">

        <label>Details & Metrics</label>
        <textarea id="taskDesc" rows="4" placeholder="Log details, outcome metrics, or execution links..."></textarea>

        <button id="saveTaskBtn" class="btn">Save Entry</button>
      </div>
    </section>

    <!-- VIEW 2: Records Dashboard -->
    <section id="viewRecords" class="view">
      <div class="card" style="padding: 12px 18px; margin-bottom: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size:0.85rem; font-weight:600; color:var(--text-muted);">WORKSPACE</span>
          <input type="month" id="monthPicker" style="width: auto; margin: 0; padding: 6px 10px; font-size: 0.85rem;">
        </div>
      </div>

      <!-- Category Filter Chips -->
      <div class="filter-bar">
        <button class="chip active" data-filter="ALL">All Records</button>
        <button class="chip" data-filter="Task">Tasks Only</button>
        <button class="chip" data-filter="Achievement">Achievements</button>
      </div>

      <!-- Dynamic Task List -->
      <div id="taskList"></div>
    </section>

    <!-- VIEW 3: Reports & Export -->
    <section id="viewReports" class="view">
      <div class="card">
        <div class="card-title">Gmail Summary Report</div>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px; line-height: 1.4;">
          Compile and format performance metrics for your selected month into an executive summary ready for distribution.
        </p>

        <label>Target Workspace Month</label>
        <input type="month" id="reportMonthPicker">

        <button id="exportReportBtn" class="btn" style="background: var(--success); color: #000;">
          ✉️ Generate Gmail Report
        </button>
      </div>
    </section>

  </main>

  <!-- Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-target="viewEntry">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Add Entry
    </button>
    <button class="nav-item" data-target="viewRecords">
      <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      Records
    </button>
    <button class="nav-item" data-target="viewReports">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 4l-7 4.5L5 7V5l7 4.5L19 5v2z"/></svg>
      Reports
    </button>
  </nav>

  <script>
    // --- CONFIGURATION ---
    const GOOGLE_CLIENT_ID = '931395948609-ecqqoecut423ij265caqoim6undfr2if.apps.googleusercontent.com';
    const DRIVE_FILE_NAME = 'tasktracker_db.json';
    const STORAGE_KEY_SESSION = 'tasktracker_google_session';

    // --- DATABASE ENGINE (IndexedDB) ---
    const DB_NAME = 'TaskTrackerDB';
    let db = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('entries')) {
            database.createObjectStore('entries', { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(); };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    const dbOps = {
      async save(entry) {
        const tx = db.transaction('entries', 'readwrite');
        tx.objectStore('entries').put(entry);
        await tx.complete;
        syncToDrive();
      },
      async getAll() {
        return new Promise((resolve) => {
          const tx = db.transaction('entries', 'readonly');
          const request = tx.objectStore('entries').getAll();
          request.onsuccess = () => resolve(request.result);
        });
      },
      async bulkReplace(entries) {
        const tx = db.transaction('entries', 'readwrite');
        const store = tx.objectStore('entries');
        store.clear();
        entries.forEach(item => store.put(item));
        return tx.complete;
      },
      async delete(id) {
        const tx = db.transaction('entries', 'readwrite');
        tx.objectStore('entries').delete(id);
        await tx.complete;
        syncToDrive();
      }
    };

    // --- GOOGLE DRIVE SYNC ENGINE ---
    let accessToken = null;
    let tokenClient = null;

    function initGoogleAuth() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.appdata',
        callback: async (response) => {
          if (response.error) return alert("Google Login Failed: " + response.error);
          saveSession(response);
          await applyAuthState();
        },
      });
      restoreSession();
    }

    function saveSession(response) {
      accessToken = response.access_token;
      const expiryTimestamp = Date.now() + ((response.expires_in || 3600) * 1000);
      localStorage.setItem(STORAGE_KEY_SESSION, JSON.stringify({ access_token: accessToken, expiry: expiryTimestamp }));
    }

    function restoreSession() {
      const raw = localStorage.getItem(STORAGE_KEY_SESSION);
      if (!raw) return;
      try {
        const session = JSON.parse(raw);
        if (session.access_token && Date.now() < (session.expiry - 300000)) {
          accessToken = session.access_token;
        } else {
          localStorage.removeItem(STORAGE_KEY_SESSION);
          accessToken = null;
        }
      } catch (err) {
        localStorage.removeItem(STORAGE_KEY_SESSION);
        accessToken = null;
      }
    }

    async function applyAuthState() {
      if (accessToken) {
        el('authScreen').classList.add('hidden');
        el('appContent').classList.remove('hidden');
        updateSyncStatus('online', 'Connected');
        await pullFromDrive();
      } else {
        el('authScreen').classList.remove('hidden');
        el('appContent').classList.add('hidden');
        updateSyncStatus('', 'Offline Mode');
      }
    }

    function updateSyncStatus(state, text) {
      const dot = el('syncDot');
      dot.className = 'dot ' + state;
      el('syncText').innerText = text;
    }

    async function findDriveFileId() {
      const res = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder', {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      if (res.status === 401) {
        localStorage.removeItem(STORAGE_KEY_SESSION);
        accessToken = null;
        applyAuthState();
        throw new Error("Unauthorized");
      }
      const data = await res.json();
      const file = data.files?.find(f => f.name === DRIVE_FILE_NAME);
      return file ? file.id : null;
    }

    async function pullFromDrive() {
      if (!accessToken) return;
      updateSyncStatus('syncing', 'Syncing...');
      try {
        const fileId = await findDriveFileId();
        if (fileId) {
          const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const remoteEntries = await res.json();
          if (Array.isArray(remoteEntries)) {
            await dbOps.bulkReplace(remoteEntries);
            render();
          }
        }
        updateSyncStatus('online', 'Synced');
      } catch (err) {
        if (accessToken) updateSyncStatus('', 'Sync Error');
      }
    }

    async function syncToDrive() {
      if (!accessToken) return;
      updateSyncStatus('syncing', 'Saving...');
      try {
        const localEntries = await dbOps.getAll();
        const fileId = await findDriveFileId();
        const blob = new Blob([JSON.stringify(localEntries, null, 2)], { type: 'application/json' });

        if (fileId) {
          await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
            method: 'PATCH',
            headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
            body: blob
          });
        } else {
          const metadata = { name: DRIVE_FILE_NAME, parents: ['appDataFolder'] };
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
          form.append('file', blob);

          await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: { Authorization: `Bearer ${accessToken}` },
            body: form
          });
        }
        updateSyncStatus('online', 'Saved');
      } catch (err) {
        if (accessToken) updateSyncStatus('', 'Save Failed');
      }
    }

    // --- APP CONTROLLERS & NAVIGATION ---
    const now = new Date();
    let currentSelectedMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    let editingId = null;
    let activeFilter = 'ALL';

    const el = id => document.getElementById(id);

    // Tab Navigation Logic
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const targetView = e.currentTarget.getAttribute('data-target');
        switchView(targetView);
      });
    });

    function switchView(viewId) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      
      const activeNav = document.querySelector(`.nav-item[data-target="${viewId}"]`);
      if (activeNav) activeNav.classList.add('active');
      
      const targetEl = el(viewId);
      if (targetEl) targetEl.classList.add('active');
    }

    // Filter Chips Controller
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        activeFilter = e.target.getAttribute('data-filter');
        render();
      });
    });

    async function render() {
      const allEntries = await dbOps.getAll();
      
      // Update history clone dropdown
      const historySelect = el('historyDropdown');
      historySelect.innerHTML = '<option value="">-- Choose template from history --</option>';
      allEntries.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = `[${item.month}] ${item.title}`;
        historySelect.appendChild(opt);
      });

      // Filter entries by Month & Type
      let monthEntries = allEntries.filter(e => e.month === currentSelectedMonth);
      if (activeFilter !== 'ALL') {
        monthEntries = monthEntries.filter(e => e.type === activeFilter);
      }

      const listContainer = el('taskList');
      listContainer.innerHTML = '';

      if (monthEntries.length === 0) {
        listContainer.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding: 24px 0; font-size:0.9rem;">No records found for this view.</p>`;
        return;
      }

      monthEntries.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'task-item';
        const typeClass = item.type === 'Achievement' ? 'achievement' : 'task';
        
        itemEl.innerHTML = `
          <div class="task-header">
            <span class="type-badge ${typeClass}">${item.type}</span>
            <span>${new Date(item.timestamp).toLocaleDateString()}</span>
          </div>
          <div class="task-title">${escapeHTML(item.title)}</div>
          <div class="task-desc">${escapeHTML(item.desc)}</div>
          <div class="task-actions">
            <button onclick="editEntry('${item.id}')" class="btn btn-secondary">Edit</button>
            <button onclick="deleteEntry('${item.id}')" class="btn btn-danger">Delete</button>
          </div>
        `;
        listContainer.appendChild(itemEl);
      });
    }

    async function handleSave() {
      const title = el('taskTitle').value.trim();
      const type = el('taskType').value;
      const desc = el('taskDesc').value.trim();

      if (!title) return alert('Title is required');

      const record = {
        id: editingId || 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        month: currentSelectedMonth,
        title,
        type,
        desc,
        timestamp: Date.now()
      };

      await dbOps.save(record);
      resetForm();
      render();
      switchView('viewRecords');
    }

    function resetForm() {
      editingId = null;
      el('taskTitle').value = '';
      el('taskDesc').value = '';
      el('formHeaderTitle').innerText = 'New Entry';
      el('saveTaskBtn').innerText = 'Save Entry';
      el('cancelEditBtn').classList.add('hidden');
    }

    window.editEntry = async (id) => {
      const all = await dbOps.getAll();
      const target = all.find(e => e.id === id);
      if (!target) return;

      editingId = target.id;
      el('taskTitle').value = target.title;
      el('taskType').value = target.type;
      el('taskDesc').value = target.desc;
      el('formHeaderTitle').innerText = 'Edit Entry';
      el('saveTaskBtn').innerText = 'Update Entry';
      el('cancelEditBtn').classList.remove('hidden');
      
      switchView('viewEntry');
    };

    window.deleteEntry = async (id) => {
      if (confirm('Delete this record?')) {
        await dbOps.delete(id);
        render();
      }
    };

    el('cancelEditBtn').addEventListener('click', resetForm);

    el('historyDropdown').addEventListener('change', async (e) => {
      const selectedId = e.target.value;
      if (!selectedId) return;
      const all = await dbOps.getAll();
      const match = all.find(item => item.id === selectedId);
      if (match) {
        el('taskTitle').value = match.title;
        el('taskType').value = match.type;
        el('taskDesc').value = match.desc;
        editingId = null;
        el('formHeaderTitle').innerText = 'Clone Entry';
        el('saveTaskBtn').innerText = 'Save Cloned Record';
      }
    });

    el('exportReportBtn').addEventListener('click', async () => {
      const targetMonth = el('reportMonthPicker').value;
      const all = await dbOps.getAll();
      const monthEntries = all.filter(e => e.month === targetMonth);
      if (monthEntries.length === 0) return alert('No data logged for the selected month.');

      let body = `Monthly Performance Report - ${targetMonth}\n===========================================\n\n`;
      monthEntries.forEach((a, i) => {
        body += `${i + 1}. [${a.type.toUpperCase()}] ${a.title}\n   ${a.desc}\n\n`;
      });

      window.location.href = `mailto:?subject=${encodeURIComponent('Performance Summary: ' + targetMonth)}&body=${encodeURIComponent(body)}`;
    });

    el('syncTrigger').addEventListener('click', pullFromDrive);
    el('googleSignInBtn').addEventListener('click', () => {
      if (tokenClient) tokenClient.requestAccessToken({ prompt: '' });
    });
    el('saveTaskBtn').addEventListener('click', handleSave);
    
    // Synchronize month pickers
    el('monthPicker').value = currentSelectedMonth;
    el('reportMonthPicker').value = currentSelectedMonth;
    
    el('monthPicker').addEventListener('change', (e) => {
      currentSelectedMonth = e.target.value;
      render();
    });

    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      render();
      
      if (window.google && google.accounts && google.accounts.oauth2) {
        initGoogleAuth();
        await applyAuthState();
      } else {
        window.addEventListener('load', async () => {
          if (window.google && google.accounts && google.accounts.oauth2) {
            initGoogleAuth();
            await applyAuthState();
          }
        });
      }
    });

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
