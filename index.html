<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TaskTracker Cloud Pro</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 20px; }
    
    header { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    
    main { padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; flex: 1; }
    .card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; margin-bottom: 16px; }
    .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    
    input, select, textarea, button { width: 100%; background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; font-size: 0.95rem; margin-top: 6px; margin-bottom: 12px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    button { background: var(--accent); color: #000; font-weight: 600; border: none; cursor: pointer; transition: opacity 0.2s; margin-bottom: 0; }
    button:active { opacity: 0.8; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.danger { background: var(--danger); color: #fff; }
    
    .sync-status { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); display: inline-block; }
    .dot.online { background: var(--success); }
    .dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
    
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    
    .task-item { background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .task-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }
    .task-title { font-size: 1rem; font-weight: 600; }
    .task-actions { display: flex; gap: 8px; margin-top: 8px; }
    .task-actions button { padding: 6px 10px; font-size: 0.8rem; }
    
    .hidden { display: none !important; }
    .row { display: flex; gap: 8px; }
    .badge { background: #0284c7; color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="authScreen" class="auth-overlay">
    <h2 style="margin-bottom: 8px;">TaskTracker Pro</h2>
    <p style="color: var(--text-muted); margin-bottom: 24px; text-align: center;">Sign in with Google to sync your tasks via Google Drive.</p>
    <button id="googleSignInBtn" style="max-width: 280px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
  </div>

  <!-- App Header -->
  <header>
    <div>
      <h1>TaskTracker</h1>
      <div class="sync-status">
        <span id="syncDot" class="dot"></span>
        <span id="syncText">Offline Mode</span>
      </div>
    </div>
    <span id="currentMonthBadge" class="badge"></span>
  </header>

  <main id="appContent" class="hidden">
    <div class="card">
      <label>Workspace Month</label>
      <input type="month" id="monthPicker">
      <div class="row" style="margin-top: 8px;">
        <button id="exportReportBtn">📧 Gmail Report</button>
        <button id="syncNowBtn" class="secondary">🔄 Sync Drive</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 12px;">New Entry</h3>
      
      <label>Copy from History</label>
      <select id="historyDropdown">
        <option value="">-- Pick previous entry to clone --</option>
      </select>

      <label>Title / Task Name</label>
      <input type="text" id="taskTitle" placeholder="e.g., Q3 Infrastructure Migration">

      <label>Type</label>
      <select id="taskType">
        <option value="Achievement">Achievement</option>
        <option value="Task">Task</option>
      </select>

      <label>Details / Metrics</label>
      <textarea id="taskDesc" rows="3" placeholder="Key outcomes, links, or metrics..."></textarea>

      <button id="saveTaskBtn">Save Record</button>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 12px;">Month Records</h3>
      <div id="taskList"></div>
    </div>
  </main>

  <script>
    // --- CONFIGURATION ---
    const GOOGLE_CLIENT_ID = '931395948609-ecqqoecut423ij265caqoim6undfr2if.apps.googleusercontent.com';
    const DRIVE_FILE_NAME = 'tasktracker_db.json';
    const STORAGE_KEY_SESSION = 'tasktracker_google_session';

    // --- DATABASE ENGINE (IndexedDB) ---
    const DB_NAME = 'TaskTrackerDB';
    let db = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('entries')) {
            database.createObjectStore('entries', { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(); };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    const dbOps = {
      async save(entry) {
        const tx = db.transaction('entries', 'readwrite');
        tx.objectStore('entries').put(entry);
        await tx.complete;
        syncToDrive();
      },
      async getAll() {
        return new Promise((resolve) => {
          const tx = db.transaction('entries', 'readonly');
          const request = tx.objectStore('entries').getAll();
          request.onsuccess = () => resolve(request.result);
        });
      },
      async bulkReplace(entries) {
        const tx = db.transaction('entries', 'readwrite');
        const store = tx.objectStore('entries');
        store.clear();
        entries.forEach(item => store.put(item));
        return tx.complete;
      },
      async delete(id) {
        const tx = db.transaction('entries', 'readwrite');
        tx.objectStore('entries').delete(id);
        await tx.complete;
        syncToDrive();
      }
    };

    // --- GOOGLE DRIVE SYNC ENGINE ---
    let accessToken = null;
    let tokenClient = null;

    function initGoogleAuth() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.appdata',
        callback: async (response) => {
          if (response.error) {
            alert("Google Login Failed: " + response.error);
            return;
          }
          saveSession(response);
          await applyAuthState();
        },
      });

      restoreSession();
    }

    function saveSession(response) {
      accessToken = response.access_token;
      // expires_in is given in seconds (typically 3600s = 1 hour)
      const expiryTimestamp = Date.now() + ((response.expires_in || 3600) * 1000);
      const sessionData = {
        access_token: accessToken,
        expiry: expiryTimestamp
      };
      localStorage.setItem(STORAGE_KEY_SESSION, JSON.stringify(sessionData));
    }

    function restoreSession() {
      const raw = localStorage.getItem(STORAGE_KEY_SESSION);
      if (!raw) return;

      try {
        const session = JSON.parse(raw);
        // Ensure token has at least 5 minutes (300,000 ms) of validity left
        if (session.access_token && Date.now() < (session.expiry - 300000)) {
          accessToken = session.access_token;
        } else {
          // Token expired or close to expiring
          localStorage.removeItem(STORAGE_KEY_SESSION);
          accessToken = null;
        }
      } catch (err) {
        localStorage.removeItem(STORAGE_KEY_SESSION);
        accessToken = null;
      }
    }

    async function applyAuthState() {
      if (accessToken) {
        el('authScreen').classList.add('hidden');
        el('appContent').classList.remove('hidden');
        updateSyncStatus('online', 'Google Drive Connected');
        await pullFromDrive();
      } else {
        el('authScreen').classList.remove('hidden');
        el('appContent').classList.add('hidden');
        updateSyncStatus('', 'Offline Mode');
      }
    }

    function updateSyncStatus(state, text) {
      const dot = el('syncDot');
      dot.className = 'dot ' + state;
      el('syncText').innerText = text;
    }

    async function findDriveFileId() {
      const res = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder', {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      
      if (res.status === 401) {
        // Token revoked or invalidated remotely
        localStorage.removeItem(STORAGE_KEY_SESSION);
        accessToken = null;
        applyAuthState();
        throw new Error("Unauthorized token");
      }

      const data = await res.json();
      const file = data.files?.find(f => f.name === DRIVE_FILE_NAME);
      return file ? file.id : null;
    }

    async function pullFromDrive() {
      if (!accessToken) return;
      updateSyncStatus('syncing', 'Syncing from Drive...');
      try {
        const fileId = await findDriveFileId();
        if (fileId) {
          const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const remoteEntries = await res.json();
          if (Array.isArray(remoteEntries)) {
            await dbOps.bulkReplace(remoteEntries);
            render();
          }
        }
        updateSyncStatus('online', 'Synced with Drive');
      } catch (err) {
        console.error(err);
        if (accessToken) updateSyncStatus('', 'Sync Error');
      }
    }

    async function syncToDrive() {
      if (!accessToken) return;
      updateSyncStatus('syncing', 'Saving to Drive...');
      try {
        const localEntries = await dbOps.getAll();
        const fileId = await findDriveFileId();
        const blob = new Blob([JSON.stringify(localEntries, null, 2)], { type: 'application/json' });

        if (fileId) {
          await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
            method: 'PATCH',
            headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
            body: blob
          });
        } else {
          const metadata = { name: DRIVE_FILE_NAME, parents: ['appDataFolder'] };
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
          form.append('file', blob);

          await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: { Authorization: `Bearer ${accessToken}` },
            body: form
          });
        }
        updateSyncStatus('online', 'Saved to Drive');
      } catch (err) {
        console.error(err);
        if (accessToken) updateSyncStatus('', 'Save Failed');
      }
    }

    // --- APP UI CONTROLLERS ---
    const now = new Date();
    let currentSelectedMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    let editingId = null;

    const el = id => document.getElementById(id);

    async function render() {
      el('currentMonthBadge').innerText = currentSelectedMonth;
      const allEntries = await dbOps.getAll();
      
      const historySelect = el('historyDropdown');
      historySelect.innerHTML = '<option value="">-- Pick previous entry to clone --</option>';
      allEntries.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = `[${item.month}] ${item.title}`;
        historySelect.appendChild(opt);
      });

      const monthEntries = allEntries.filter(e => e.month === currentSelectedMonth);
      const listContainer = el('taskList');
      listContainer.innerHTML = '';

      if (monthEntries.length === 0) {
        listContainer.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding: 12px;">No tasks logged for ${currentSelectedMonth}.</p>`;
        return;
      }

      monthEntries.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'task-item';
        itemEl.innerHTML = `
          <div class="task-header">
            <span>${item.type}</span>
            <span>${new Date(item.timestamp).toLocaleDateString()}</span>
          </div>
          <div class="task-title">${escapeHTML(item.title)}</div>
          <div style="font-size: 0.85rem; color: var(--text-muted); white-space: pre-wrap;">${escapeHTML(item.desc)}</div>
          <div class="task-actions">
            <button onclick="editEntry('${item.id}')" class="secondary">Edit</button>
            <button onclick="deleteEntry('${item.id}')" class="danger">Delete</button>
          </div>
        `;
        listContainer.appendChild(itemEl);
      });
    }

    async function handleSave() {
      const title = el('taskTitle').value.trim();
      const type = el('taskType').value;
      const desc = el('taskDesc').value.trim();

      if (!title) return alert('Title is required');

      const record = {
        id: editingId || 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        month: currentSelectedMonth,
        title,
        type,
        desc,
        timestamp: Date.now()
      };

      await dbOps.save(record);
      editingId = null;
      el('taskTitle').value = '';
      el('taskDesc').value = '';
      el('saveTaskBtn').innerText = 'Save Record';
      render();
    }

    window.editEntry = async (id) => {
      const all = await dbOps.getAll();
      const target = all.find(e => e.id === id);
      if (!target) return;

      editingId = target.id;
      el('taskTitle').value = target.title;
      el('taskType').value = target.type;
      el('taskDesc').value = target.desc;
      el('saveTaskBtn').innerText = 'Update Record';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteEntry = async (id) => {
      if (confirm('Delete this record?')) {
        await dbOps.delete(id);
        render();
      }
    };

    el('historyDropdown').addEventListener('change', async (e) => {
      const selectedId = e.target.value;
      if (!selectedId) return;
      const all = await dbOps.getAll();
      const match = all.find(item => item.id === selectedId);
      if (match) {
        el('taskTitle').value = match.title;
        el('taskType').value = match.type;
        el('taskDesc').value = match.desc;
        editingId = null;
        el('saveTaskBtn').innerText = 'Save Record (Cloning)';
      }
    });

    el('exportReportBtn').addEventListener('click', async () => {
      const all = await dbOps.getAll();
      const monthEntries = all.filter(e => e.month === currentSelectedMonth);
      if (monthEntries.length === 0) return alert('No data for selected month.');

      let body = `Monthly Performance & Task Report - ${currentSelectedMonth}\n===========================================\n\n`;
      monthEntries.forEach((a, i) => {
        body += `${i + 1}. [${a.type}] ${a.title}\n   Notes: ${a.desc}\n\n`;
      });

      window.location.href = `mailto:?subject=${encodeURIComponent('Monthly Report: ' + currentSelectedMonth)}&body=${encodeURIComponent(body)}`;
    });

    el('syncNowBtn').addEventListener('click', pullFromDrive);
    el('googleSignInBtn').addEventListener('click', () => {
      if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: '' });
      }
    });
    el('saveTaskBtn').addEventListener('click', handleSave);
    
    el('monthPicker').value = currentSelectedMonth;
    el('monthPicker').addEventListener('change', (e) => {
      currentSelectedMonth = e.target.value;
      render();
    });

    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      render();
      
      // Wait for Google Identity Services script to initialize
      if (window.google && google.accounts && google.accounts.oauth2) {
        initGoogleAuth();
        await applyAuthState();
      } else {
        window.addEventListener('load', async () => {
          if (window.google && google.accounts && google.accounts.oauth2) {
            initGoogleAuth();
            await applyAuthState();
          }
        });
      }
    });

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
