<!DOCTYPE html>
<html lang="en" data-theme="light" data-ui-style="default" data-color-palette="sage">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TaskTracker Pro</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #6b8299;
      --primary-hover: #5a6f83;
      --primary-soft: #eaeff3;
      --bg: #f6f5f2;
      --surface: #ffffff;
      --card-border: #e6e3da;
      --text: #33332f;
      --text-muted: #82807a;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,0.04);
      --sidebar-width: 240px;
    }

    [data-theme="dark"] {
      --bg: #121214;
      --surface: #1e1e22;
      --card-border: #2e2e34;
      --text: #e4e4e7;
      --text-muted: #a1a1aa;
      --primary-soft: #2d3748;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

    /* Sidebar Layout */
    aside.sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 14px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
    }

    .brand-title { font-size: 1.1rem; font-weight: 800; padding: 0 8px 16px; border-bottom: 1px solid var(--card-border); }
    .nav-group { display: flex; flex-direction: column; gap: 4px; margin-top: 16px; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      background: none;
      border: none;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }
    .nav-item.active, .nav-item:hover { background: var(--primary-soft); color: var(--primary); }
    .nav-item svg { width: 18px; height: 18px; fill: currentColor; }

    /* Main Content Wrapper */
    .layout-content {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      background: var(--surface);
      padding: 14px 24px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    main { padding: 24px; max-width: 900px; width: 100%; margin: 0 auto; }
    .view { display: none; }
    .view.active { display: block; }

    .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--card-border); padding: 20px; margin-bottom: 16px; }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }

    label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-top: 14px; margin-bottom: 6px; text-transform: uppercase; }
    input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; }

    .btn { background: var(--primary); color: #fff; font-weight: 600; border: none; padding: 10px 16px; border-radius: 8px; font-size: 0.88rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--card-border); }

    .table-container { width: 100%; overflow-x: auto; background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--card-border); text-align: left; }

    .action-group { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
    .push-btn { background: var(--bg); border: 1px solid var(--card-border); border-radius: 4px; padding: 2px 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer; color: var(--text-muted); }
    .push-btn:hover { background: var(--primary-soft); color: var(--primary); }

    .sync-badge { font-size: 0.75rem; background: var(--bg); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--card-border); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
    .dot.online { background: #7a9b7e; }

    .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .hidden { display: none !important; }

    .version-footer {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: lowercase;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--card-border);
    }

    @media (max-width: 768px) {
      aside.sidebar { width: 60px; padding: 12px 8px; }
      .brand-title, .nav-item span { display: none; }
      .layout-content { margin-left: 60px; }
    }
  </style>
</head>
<body>

  <div id="authScreen" class="auth-overlay">
    <div style="text-align: center;">
      <h2 style="margin-bottom: 12px;">TaskTracker Pro</h2>
      <button id="googleSignInBtn" class="btn btn-secondary">Sign in with Google</button>
    </div>
  </div>

  <aside class="sidebar">
    <div>
      <div class="brand-title">TaskTracker</div>
      <nav class="nav-group">
        <button class="nav-item active" data-target="viewRecords">
          <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
          <span>Records</span>
        </button>
        <button class="nav-item" data-target="viewEntry">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span>Add Task</span>
        </button>
        <button class="nav-item" data-target="viewSettings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          <span>Settings</span>
        </button>
      </nav>
    </div>
  </aside>

  <div class="layout-content">
    <header>
      <span style="font-size:0.9rem; font-weight:700;">Task Management Workspace</span>
      <div class="sync-badge">
        <span id="syncDot" class="dot"></span>
        <span id="syncText">Local</span>
      </div>
    </header>

    <main id="appContent" class="hidden">

      <section id="viewRecords" class="view active">
        <div class="card" style="padding:12px 18px; margin-bottom:14px;">
          <input type="month" id="monthPicker" style="width:auto;">
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date / Time</th>
                <th>Type</th>
                <th>Title</th>
                <th>Details</th>
                <th style="text-align: right;">Push / Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="viewEntry" class="view">
        <div class="card">
          <div class="card-title" id="formHeaderTitle">New Entry</div>

          <label>Target Date & Time</label>
          <input type="datetime-local" id="taskTimestamp">

          <label>Type</label>
          <select id="taskType">
            <option value="Task">Task</option>
            <option value="Achievement">Achievement</option>
          </select>

          <label>Title</label>
          <input type="text" id="taskTitle">

          <label>Details</label>
          <textarea id="taskDesc" rows="4"></textarea>

          <button id="saveTaskBtn" class="btn" style="margin-top:16px;">Save Entry</button>
        </div>
      </section>

      <section id="viewSettings" class="view">
        <div class="card">
          <div class="card-title">Preferences</div>
          <label>Username</label>
          <input type="text" id="usernameInput">
          <button id="saveSettingsBtn" class="btn" style="margin-top:16px;">Save Settings</button>
          
          <div class="version-footer">
            Task Tracker Pro (beta 0.7)
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = '931395948609-ecqqoecut423ij265caqoim6undfr2if.apps.googleusercontent.com';
    const DB_NAME = 'TaskTrackerDB_v2';
    let db = null;
    let editingId = null;

    const el = id => document.getElementById(id);

    /* IndexedDB */
    function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => e.target.result.createObjectStore('entries', { keyPath: 'id' });
        req.onsuccess = (e) => { db = e.target.result; resolve(); };
      });
    }

    const dbOps = {
      async getAll() {
        return new Promise(res => {
          const tx = db.transaction('entries', 'readonly');
          tx.objectStore('entries').getAll().onsuccess = (e) => res(e.target.result || []);
        });
      },
      async save(entry) {
        const tx = db.transaction('entries', 'readwrite');
        tx.objectStore('entries').put(entry);
        await tx.complete;
      },
      async delete(id) {
        const tx = db.transaction('entries', 'readwrite');
        tx.objectStore('entries').delete(id);
        await tx.complete;
      }
    };

    /* Date Time Utilities */
    function toLocalISOString(date) {
      const tzOffset = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - tzOffset).toISOString().slice(0, 16);
    }

    /* Core Actions */
    async function render() {
      const all = await dbOps.getAll();
      const monthFilter = el('monthPicker').value;
      const filtered = all.filter(e => e.month === monthFilter).sort((a,b) => b.timestamp - a.timestamp);
      
      const tbody = el('tableBody');
      tbody.innerHTML = '';

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        const dtStr = new Date(item.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

        tr.innerHTML = `
          <td style="font-size:0.78rem; font-weight:600;">${dtStr}</td>
          <td>${item.type}</td>
          <td style="font-weight:600;">${escapeHTML(item.title)}</td>
          <td style="color:var(--text-muted); font-size:0.82rem;">${escapeHTML(item.desc || '-')}</td>
          <td>
            <div class="action-group">
              <button class="push-btn" onclick="shiftDate('${item.id}', -86400000)">-1D</button>
              <button class="push-btn" onclick="shiftDate('${item.id}', 86400000)">+1D</button>
              <button class="push-btn" onclick="editEntry('${item.id}')">Edit</button>
              <button class="push-btn" style="color:red;" onclick="deleteEntry('${item.id}')">✕</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function shiftDate(id, deltaMs) {
      const all = await dbOps.getAll();
      const item = all.find(e => e.id === id);
      if (!item) return;

      item.timestamp += deltaMs;
      const d = new Date(item.timestamp);
      item.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      
      await dbOps.save(item);
      render();
    }

    async function handleSave() {
      const title = el('taskTitle').value.trim();
      const dtVal = el('taskTimestamp').value;
      if (!title || !dtVal) return alert('Title and Date/Time are required');

      const dt = new Date(dtVal);
      const record = {
        id: editingId || 'id_' + Date.now(),
        timestamp: dt.getTime(),
        month: `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`,
        type: el('taskType').value,
        title,
        desc: el('taskDesc').value.trim()
      };

      await dbOps.save(record);
      editingId = null;
      resetForm();
      switchView('viewRecords');
      render();
    }

    function resetForm() {
      editingId = null;
      el('taskTitle').value = '';
      el('taskDesc').value = '';
      el('taskTimestamp').value = toLocalISOString(new Date());
      el('formHeaderTitle').innerText = 'New Entry';
    }

    window.editEntry = async (id) => {
      const all = await dbOps.getAll();
      const item = all.find(e => e.id === id);
      if (!item) return;

      editingId = item.id;
      el('taskTitle').value = item.title;
      el('taskType').value = item.type;
      el('taskDesc').value = item.desc;
      el('taskTimestamp').value = toLocalISOString(new Date(item.timestamp));
      el('formHeaderTitle').innerText = 'Edit Entry';
      switchView('viewEntry');
    };

    window.deleteEntry = async (id) => {
      if (confirm('Delete entry?')) {
        await dbOps.delete(id);
        render();
      }
    };

    function switchView(viewId) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.getAttribute('data-target') === viewId));
      document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === viewId));
    }

    function escapeHTML(str) { return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

    /* Navigation & Initialization */
    document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', e => switchView(e.currentTarget.getAttribute('data-target'))));
    el('saveTaskBtn').addEventListener('click', handleSave);

    const now = new Date();
    el('monthPicker').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    el('monthPicker').addEventListener('change', render);

    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      resetForm();
      render();
      el('authScreen').classList.add('hidden');
      el('appContent').classList.remove('hidden');
    });
  </script>
</body>
</html>
